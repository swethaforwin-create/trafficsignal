<!DOCTYPE html>
<html>
<head>
    <title>AI Traffic Detection</title>

    <style>
        body {
            font-family: Arial;
            background: #0b1736;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: #172952;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: none;
            border-radius: 8px;
        }

        button {
            padding: 13px 25px;
            margin: 15px 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .analyze {
            background: #35d07f;
        }

        .back {
            background: #4da3ff;
            color: white;
        }

        #result {
            margin-top: 25px;
            color: #35d07f;
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<h1>📍 AI Traffic Detection</h1>

<p>Enter your location to analyze nearby traffic</p>

<div class="box">

    <h2>📍 Location</h2>

    <input type="text" id="location"
           placeholder="Example: Trichy Central Bus Stand">

    <button class="analyze" onclick="analyzeTraffic()">
        🤖 Analyze Traffic
    </button>

    <div id="result"></div>

</div>

<button class="back" onclick="location.href='suggestions.html'">
    ↩️ Back to Suggestions
</button>

<script>

function analyzeTraffic() {

    let location =
        document.getElementById("location").value;

    if (location == "") {
        document.getElementById("result").innerText =
            "⚠️ Please enter your location.";
        return;
    }

    // AI simulated vehicle prediction
    let bikes = Math.floor(Math.random() * 30) + 10;
    let cars = Math.floor(Math.random() * 20) + 5;
    let buses = Math.floor(Math.random() * 8) + 2;
    let trucks = Math.floor(Math.random() * 6) + 1;
    let autos = Math.floor(Math.random() * 12) + 3;

    let total = bikes + cars + buses + trucks + autos;

    let level;

    if (total >= 70) {
        level = "🔴 HIGH";
    }
    else if (total >= 40) {
        level = "🟡 MEDIUM";
    }
    else {
        level = "🟢 LOW";
    }

    document.getElementById("result").innerHTML =

        "📍 Location: <b>" + location + "</b><br><br>" +

        "🤖 AI Traffic Prediction<br>" +
        "🏍️ Bikes: " + bikes + "<br>" +
        "🚗 Cars: " + cars + "<br>" +
        "🚌 Buses: " + buses + "<br>" +
        "🚚 Trucks: " + trucks + "<br>" +
        "🛺 Autos: " + autos + "<br><br>" +

        "🚦 Total Vehicles: " + total + "<br>" +
        "📊 Traffic Level: " + level;
}

</script>

<script src="sound.js"></script>
</body>
</html>
