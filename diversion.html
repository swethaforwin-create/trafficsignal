<!DOCTYPE html>
<html>
<head>
    <title>Traffic Diversion</title>

    <style>
        body {
            font-family: Arial;
            background: #0b1736;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: #172952;
            max-width: 550px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
        }

        .route {
            background: #203761;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
        }

        input {
            width: 85%;
            padding: 11px;
            margin: 7px;
            border: none;
            border-radius: 7px;
        }

        button {
            padding: 13px 25px;
            margin: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .suggest {
            background: #35d07f;
        }

        .back {
            background: #4da3ff;
            color: white;
        }

        #result {
            margin-top: 20px;
            color: #35d07f;
            font-size: 18px;
        }
    </style>
</head>

<body>

<h1>🚗 Traffic Diversion</h1>

<p>AI compares vehicle traffic and suggests the better route.</p>

<div class="box">

    <div class="route">
        <h2>🛣️ Route 1</h2>

        <input type="number" id="r1car"
               placeholder="🚗 Cars">

        <input type="number" id="r1bus"
               placeholder="🚌 Buses">

        <input type="number" id="r1bike"
               placeholder="🏍️ Bikes">

        <input type="number" id="r1auto"
               placeholder="🛺 Autos">
    </div>

    <div class="route">
        <h2>🛣️ Route 2</h2>

        <input type="number" id="r2car"
               placeholder="🚗 Cars">

        <input type="number" id="r2bus"
               placeholder="🚌 Buses">

        <input type="number" id="r2bike"
               placeholder="🏍️ Bikes">

        <input type="number" id="r2auto"
               placeholder="🛺 Autos">
    </div>

    <button class="suggest" onclick="getRoute()">
        🤖 Get AI Suggestion
    </button>

    <div id="result"></div>

</div>

<button class="back"
        onclick="location.href='suggestions.html'">
    ↩️ Back to Suggestions
</button>

<script>

function getRoute() {

    let r1 =
        Number(document.getElementById("r1car").value) +
        Number(document.getElementById("r1bus").value) +
        Number(document.getElementById("r1bike").value) +
        Number(document.getElementById("r1auto").value);

    let r2 =
        Number(document.getElementById("r2car").value) +
        Number(document.getElementById("r2bus").value) +
        Number(document.getElementById("r2bike").value) +
        Number(document.getElementById("r2auto").value);

    let result;

    if (r1 < r2) {

        result =
        "🤖 AI Suggestion: Use Route 1. " +
        "Total traffic = " + r1 +
        " vehicles, which is lower.";

    } else if (r2 < r1) {

        result =
        "🤖 AI Suggestion: Use Route 2. " +
        "Total traffic = " + r2 +
        " vehicles, which is lower.";

    } else {

        result =
        "🤖 AI Suggestion: Both routes have equal traffic.";

    }

    document.getElementById("result").innerText = result;
}

</script>

</body>
</html>
