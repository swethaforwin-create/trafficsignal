<!DOCTYPE html>
<html>
<head>
    <title>AI Agent Coordination</title>

    <style>
        body {
            font-family: Arial;
            background: #0b1736;
            color: white;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #35d07f;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .card {
            background: #172952;
            width: 200px;
            padding: 20px;
            border-radius: 15px;
        }

        .number {
            font-size: 32px;
            color: #ffd75e;
            font-weight: bold;
        }

        button {
            padding: 14px 25px;
            margin: 25px 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .run {
            background: #35d07f;
        }

        .back {
            background: #4da3ff;
            color: white;
        }

        #result {
            background: #172952;
            max-width: 650px;
            margin: 25px auto;
            padding: 20px;
            border-radius: 15px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<h1>🤖 AI Agent Coordination</h1>

<p>Autonomous agents communicate and optimize traffic</p>

<div class="container">

    <div class="card">
        <h2>🚦 Junction 1</h2>
        <p>Traffic</p>
        <div class="number" id="j1">--</div>
    </div>

    <div class="card">
        <h2>🚦 Junction 2</h2>
        <p>Traffic</p>
        <div class="number" id="j2">--</div>
    </div>

    <div class="card">
        <h2>🚦 Junction 3</h2>
        <p>Traffic</p>
        <div class="number" id="j3">--</div>
    </div>

    <div class="card">
        <h2>🚦 Junction 4</h2>
        <p>Traffic</p>
        <div class="number" id="j4">--</div>
    </div>

</div>

<button class="run" onclick="coordinateAgents()">
    🤖 Run AI Coordination
</button>

<div id="result">
    Waiting for AI agents...
</div>

<button class="back"
        onclick="location.href='suggestions.html'">
    ↩️ Back to Suggestions
</button>

<script>

function coordinateAgents() {

    // AI simulated traffic detection
    let j1 = Math.floor(Math.random() * 80) + 20;
    let j2 = Math.floor(Math.random() * 80) + 20;
    let j3 = Math.floor(Math.random() * 80) + 20;
    let j4 = Math.floor(Math.random() * 80) + 20;

    document.getElementById("j1").innerText = j1 + " vehicles";
    document.getElementById("j2").innerText = j2 + " vehicles";
    document.getElementById("j3").innerText = j3 + " vehicles";
    document.getElementById("j4").innerText = j4 + " vehicles";

    let traffic = [j1, j2, j3, j4];

    let maxTraffic = Math.max(...traffic);

    let junction =
        traffic.indexOf(maxTraffic) + 1;

    document.getElementById("result").innerHTML =

        "📡 <b>Agent Communication</b><br><br>" +

        "Agent 1 → Agents: Traffic data detected<br>" +

        "Agent 2 → Agents: Traffic flow analyzed<br>" +

        "Agent 3 → Agents: Congestion identified<br>" +

        "Agent 4 → All Agents: Coordination decision made<br><br>" +

        "🔴 Highest Traffic: Junction " +
        junction + "<br>" +

        "🚦 AI Decision: Give more GREEN time to " +
        "Junction " + junction + "<br><br>" +

        "✅ All agents coordinated successfully.";

}

</script>

</body>
</html>
