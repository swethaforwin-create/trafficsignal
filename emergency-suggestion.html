<!DOCTYPE html>
<html>
<head>
    <title>Emergency Priority AI</title>

    <style>
        body {
            font-family: Arial;
            background: #0b1736;
            color: white;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #ff6262;
        }

        .box {
            background: #172952;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
        }

        input, select {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: none;
            border-radius: 8px;
        }

        button {
            padding: 13px 25px;
            margin: 15px 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .activate {
            background: #ff6262;
            color: white;
        }

        .back {
            background: #4da3ff;
            color: white;
        }

        #result {
            margin-top: 25px;
            color: #35d07f;
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<h1>🚑 Emergency Vehicle Priority</h1>

<p>AI predicts the emergency vehicle route</p>

<div class="box">

    <h2>🚑 Emergency Vehicle</h2>

    <select id="vehicle">
        <option value="Ambulance">🚑 Ambulance</option>
        <option value="Fire Truck">🚒 Fire Truck</option>
        <option value="Police Vehicle">🚓 Police Vehicle</option>
    </select>

    <h3>📍 Where do you want to go?</h3>

    <input type="text"
           id="destination"
           placeholder="Enter destination">

    <button class="activate" onclick="predictRoute()">
        🤖 Predict Emergency Route
    </button>

    <div id="result"></div>

</div>

<button class="back"
        onclick="location.href='suggestions.html'">
    ↩️ Back to Suggestions
</button>

<script>

function predictRoute() {

    let vehicle =
        document.getElementById("vehicle").value;

    let destination =
        document.getElementById("destination").value;

    if (destination == "") {
        document.getElementById("result").innerText =
            "⚠️ Please enter your destination.";
        return;
    }

    // AI simulated prediction
    let distance =
        Math.floor(Math.random() * 8) + 1;

    let signal =
        Math.floor(Math.random() * 4) + 1;

    let eta =
        Math.floor(distance * 2) + 3;

    document.getElementById("result").innerHTML =

        "🚑 Vehicle: <b>" + vehicle + "</b><br>" +

        "📍 Destination: <b>" +
        destination + "</b><br><br>" +

        "🤖 AI Prediction<br>" +

        "📏 Distance to nearest signal: " +
        distance + " km<br>" +

        "🚦 Nearest Signal: Signal " +
        signal + "<br>" +

        "⏱️ Estimated Arrival: " +
        eta + " minutes<br><br>" +

        "🟢 Emergency Priority Activated<br>" +

        "🚦 AI will give GREEN priority to " +
        "Signal " + signal + " for the emergency vehicle.";
}

</script>

</body>
</html>
