<!DOCTYPE html>
<html>
<head>
    <title>AI Traffic Route Prediction</title>

    <style>
        body {
            font-family: Arial;
            background: #0b1736;
            color: white;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #4da3ff;
        }

        .box {
            background: #172952;
            max-width: 550px;
            margin: 35px auto;
            padding: 30px;
            border-radius: 15px;
        }

        input, select {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: none;
            border-radius: 8px;
        }

        button {
            padding: 14px 25px;
            margin: 15px 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .predict {
            background: #35d07f;
        }

        .back {
            background: #4da3ff;
            color: white;
        }

        #result {
            margin-top: 25px;
            color: #35d07f;
            font-size: 18px;
            line-height: 1.9;
        }

        .route {
            background: #0b1736;
            padding: 12px;
            margin: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h1>🚦 AI Traffic Route Prediction</h1>

<p>Enter your journey details</p>

<div class="box">

    <h2>📍 Journey Details</h2>

    <input type="text"
           id="from"
           placeholder="From - Example: Kattur">

    <input type="text"
           id="to"
           placeholder="To - Example: Railway Junction">

    <select id="vehicle">
        <option value="Bike">🏍️ Bike</option>
        <option value="Car">🚗 Car</option>
        <option value="Bus">🚌 Bus</option>
        <option value="Auto">🛺 Auto</option>
        <option value="Truck">🚚 Truck</option>
    </select>

    <button class="predict" onclick="predictRoute()">
        🤖 Predict Route
    </button>

    <div id="result"></div>

</div>

<button class="back"
        onclick="location.href='index.html'">
    🏠 Back to Menu
</button>


<script>

function predictRoute() {

    let from =
        document.getElementById("from").value;

    let to =
        document.getElementById("to").value;

    let vehicle =
        document.getElementById("vehicle").value;

    if (from == "" || to == "") {

        document.getElementById("result").innerText =
            "⚠️ Please enter From and To locations.";

        return;
    }

    // AI simulated route prediction

    let distance1 =
        Math.floor(Math.random() * 4) + 6;

    let distance2 =
        distance1 + Math.floor(Math.random() * 3) + 1;

    let signals1 =
        Math.floor(Math.random() * 3) + 3;

    let signals2 =
        Math.floor(Math.random() * 3) + 5;

    let traffic1 =
        Math.floor(Math.random() * 40) + 20;

    let traffic2 =
        Math.floor(Math.random() * 40) + 40;


    let recommendation;

    if (traffic1 < traffic2) {

        recommendation =
            "🟢 AI Recommendation: Route 1 is easier and has less traffic.";

    } else {

        recommendation =
            "🟢 AI Recommendation: Route 2 is easier and has less traffic.";
    }


    document.getElementById("result").innerHTML =

        "📍 From: <b>" + from + "</b><br>" +

        "🎯 To: <b>" + to + "</b><br>" +

        "🏍️ Vehicle: <b>" + vehicle + "</b><br><br>" +

        "<div class='route'>" +
        "🛣️ <b>Route 1</b><br>" +
        "📏 Distance: " + distance1 + " km<br>" +
        "🚦 Signals: " + signals1 + "<br>" +
        "🚗 Traffic Level: " + traffic1 + "%" +
        "</div>" +

        "<div class='route'>" +
        "🛣️ <b>Route 2</b><br>" +
        "📏 Distance: " + distance2 + " km<br>" +
        "🚦 Signals: " + signals2 + "<br>" +
        "🚗 Traffic Level: " + traffic2 + "%" +
        "</div>" +

        "<br>" +

        recommendation;
}

</script>

</body>
</html>
