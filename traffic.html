<!DOCTYPE html>
<html>
<head>
    <title>AI Traffic Simulation</title>

    <style>
        body {
            font-family: Arial;
            background: #0b1736;
            color: white;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #4da3ff;
        }

        .box {
            background: #172952;
            max-width: 500px;
            margin: 35px auto;
            padding: 30px;
            border-radius: 15px;
        }

        input, select {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: none;
            border-radius: 8px;
        }

        button {
            padding: 14px 25px;
            margin: 15px 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .predict {
            background: #35d07f;
        }

        .back {
            background: #4da3ff;
            color: white;
        }

        #result {
            margin-top: 25px;
            color: #35d07f;
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<h1>🚦 AI Traffic Simulation</h1>

<p>Tell AI where you are going</p>

<div class="box">

    <h2>📍 Traffic Details</h2>

    <input type="text"
           id="location"
           placeholder="Enter your current location">

    <input type="text"
           id="destination"
           placeholder="Where are you going?">

    <select id="vehicle">
        <option value="Car">🚗 Car</option>
        <option value="Bike">🏍️ Bike</option>
        <option value="Bus">🚌 Bus</option>
        <option value="Auto">🛺 Auto</option>
        <option value="Truck">🚚 Truck</option>
    </select>

    <button class="predict" onclick="predictTraffic()">
        🤖 Predict Traffic
    </button>

    <div id="result"></div>

</div>

<button class="back"
        onclick="location.href='index.html'">
    🏠 Back to Menu
</button>

<script>

function predictTraffic() {

    let location =
        document.getElementById("location").value;

    let destination =
        document.getElementById("destination").value;

    let vehicle =
        document.getElementById("vehicle").value;

    if (location == "" || destination == "") {

        document.getElementById("result").innerText =
            "⚠️ Please enter your location and destination.";

        return;
    }

    // AI simulated prediction

    let vehicles =
        Math.floor(Math.random() * 100) + 50;

    let congestion =
        Math.floor(Math.random() * 70) + 20;

    let waiting =
        Math.floor(Math.random() * 10) + 2;

    let level;

    if (congestion >= 70) {
        level = "🔴 HIGH";
    }
    else if (congestion >= 40) {
        level = "🟡 MEDIUM";
    }
    else {
        level = "🟢 LOW";
    }

    let suggestion;

    if (congestion >= 70) {
        suggestion =
            "⚠️ AI Suggestion: Consider an alternate route.";
    }
    else if (congestion >= 40) {
        suggestion =
            "💡 AI Suggestion: Traffic is moderate. Expect some delay.";
    }
    else {
        suggestion =
            "✅ AI Suggestion: Route is relatively clear.";
    }

    document.getElementById("result").innerHTML =

        "📍 From: <b>" + location + "</b><br>" +

        "🎯 To: <b>" + destination + "</b><br>" +

        "🚗 Vehicle: <b>" + vehicle + "</b><br><br>" +

        "🤖 AI Traffic Prediction<br>" +

        "🚙 Estimated Vehicles: " +
        vehicles + "<br>" +

        "🚦 Congestion: " +
        congestion + "%<br>" +

        "⏱️ Estimated Waiting: " +
        waiting + " minutes<br>" +

        "📊 Traffic Level: " +
        level + "<br><br>" +

        suggestion;
}

</script>

</body>
</html>
