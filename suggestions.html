<!DOCTYPE html>
<html>
<head>
    <title>AI Suggestions</title>
    <style>
        body {
            font-family: Arial;
            background: #0b1736;
            color: white;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #4da3ff;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background: #172952;
            width: 230px;
            padding: 25px;
            border-radius: 15px;
        }

        .card h2 {
            color: #35d07f;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            background: #35d07f;
        }

        .back {
            margin-top: 30px;
            background: #4da3ff;
            color: white;
        }
    </style>
</head>

<body>

<h1>💡 AI Traffic Suggestions</h1>
<p>Select an option</p>

<div class="container">

    <div class="card">
        <h2>🚦 Signal Optimization</h2>
        <p>Optimize green signal time.</p>
        <button onclick="location.href='signal-optimization.html'">
            Open
        </button>
    </div>

    <div class="card">
        <h2>🚗 Traffic Diversion</h2>
        <p>Find a less congested route.</p>
        <button onclick="location.href='diversion.html'">
            Open
        </button>
    </div>

    <div class="card">
        <h2>🚑 Emergency Priority</h2>
        <p>Give priority to emergency vehicles.</p>
        <button onclick="location.href='emergency-suggestion.html'">
            Open
        </button>
    </div>

    <div class="card">
        <h2>🤖 Agent Coordination</h2>
        <p>Coordinate traffic AI agents.</p>
        <button onclick="location.href='agent-coordination.html'">
            Open
        </button>
    </div>

</div>

<br>

<button class="back" onclick="location.href='index.html'">
    🏠 Back to Menu
</button>

</body>
</html>
