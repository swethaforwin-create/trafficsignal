<!DOCTYPE html>
<html>
<head>
    <title>Signal Optimization</title>
    <style>
        body {
            font-family: Arial;
            background: #0b1736;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: #172952;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
        }

        input, select {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 13px 25px;
            margin: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn {
            background: #35d07f;
        }

        .back {
            background: #4da3ff;
            color: white;
        }

        #result {
            margin-top: 20px;
            color: #35d07f;
            font-size: 18px;
        }
    </style>
</head>

<body>

<h1>🚦 Signal Optimization</h1>

<div class="box">

    <h2>AI Traffic Input</h2>

    <input type="number" id="traffic"
           placeholder="Enter vehicles">

    <select id="signal">
        <option value="1">Signal 1</option>
        <option value="2">Signal 2</option>
        <option value="3">Signal 3</option>
        <option value="4">Signal 4</option>
    </select>

    <button class="btn" onclick="getSuggestion()">
        🤖 Get AI Suggestion
    </button>

    <div id="result"></div>

</div>

<button class="back" onclick="location.href='suggestions.html'">
    ↩️ Back to Suggestions
</button>

<script>
function getSuggestion() {

    let traffic =
        Number(document.getElementById("traffic").value);

    let signal =
        document.getElementById("signal").value;

    let time;

    if (traffic >= 80) {
        time = 60;
    }
    else if (traffic >= 40) {
        time = 40;
    }
    else {
        time = 25;
    }

    document.getElementById("result").innerText =
        "🤖 AI Suggestion: Signal " + signal +
        " should stay GREEN for " + time +
        " seconds.";
}
</script>

<script src="sound.js"></script>
</body>
</html>
